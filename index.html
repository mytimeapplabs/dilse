<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HR Tracker Prototype</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 2rem; }
    #hrDisplay { font-size: 5rem; font-weight: bold; margin: 1rem 0; }
    button { font-size: 1.2rem; padding: 0.8rem 1.5rem; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Coros HR Tracker</h1>
  <button id="connectBtn">Connect HR Band</button>
  <div id="hrDisplay">-- bpm</div>
  <p id="status">Disconnected</p>

  <script>
    const connectBtn = document.getElementById('connectBtn');
    const hrDisplay = document.getElementById('hrDisplay');
    const statusEl = document.getElementById('status');

    connectBtn.addEventListener('click', async () => {
      try {
        statusEl.innerText = 'Requesting Bluetooth Device...';
        
        // Step 1: Request BLE device with Heart Rate Service
        const device = await navigator.bluetooth.requestDevice({
          filters: [{ services: ['heart_rate'] }]
        });

        statusEl.innerText = 'Connecting to GATT Server...';
        const server = await device.gatt.connect();

        statusEl.innerText = 'Getting Heart Rate Service...';
        const service = await server.getPrimaryService('heart_rate');

        statusEl.innerText = 'Getting HR Measurement Characteristic...';
        const characteristic = await service.getCharacteristic('heart_rate_measurement');

        // Step 2: Subscribe to notifications
        await characteristic.startNotifications();
        characteristic.addEventListener('characteristicvaluechanged', handleHRUpdate);

        statusEl.innerText = `Connected to ${device.name || 'Coros Band'}`;
      } catch (error) {
        statusEl.innerText = `Error: ${error.message}`;
      }
    });

    function handleHRUpdate(event) {
      const value = event.target.value;
      // Flags byte determines if HR is 8-bit or 16-bit
      const flags = value.getUint8(0);
      const is16Bit = flags & 0x01;
      
      let heartRate;
      if (is16Bit) {
        heartRate = value.getUint16(1, true); // Little endian
      } else {
        heartRate = value.getUint8(1);
      }

      hrDisplay.innerText = `${heartRate} bpm`;
    }
  </script>
</body>
</html>
